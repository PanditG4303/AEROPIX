# AEROPIX — Nginx site configuration for a single EC2 instance.
#
# Layout on the server:
#   /opt/aeropix/frontend/dist   -> React production build (static files)
#   /opt/aeropix/backend         -> FastAPI application
#   systemd service "aeropix"    -> Gunicorn/Uvicorn on 127.0.0.1:8000
#
# Install:
#   sudo cp infrastructure/nginx/aeropix.conf /etc/nginx/sites-available/aeropix
#   sudo ln -s /etc/nginx/sites-available/aeropix /etc/nginx/sites-enabled/aeropix
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: run `sudo certbot --nginx -d your-domain.example` after DNS points to
# the Elastic IP. Certbot edits this file and adds the TLS server block.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/aeropix/frontend/dist;
    index index.html;

    # 15 MB application limit + multipart overhead.
    client_max_body_size 20m;
    client_body_timeout 60s;

    # Hide the Nginx version.
    server_tokens off;

    # ---------------------------------------------------------------------
    # API -> FastAPI (Gunicorn + Uvicorn worker)
    # ^~ prevents the static-file regex below from intercepting
    # /api/media/... image URLs.
    # ---------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Uploads can take a moment on small instances; do not retry blindly.
        proxy_request_buffering on;
        proxy_buffering on;
    }

    # ---------------------------------------------------------------------
    # Hashed Vite assets: safe to cache for a year.
    # ---------------------------------------------------------------------
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /theme-init.js {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Unhashed images and fonts.
    # ---------------------------------------------------------------------
    location ~* \.(?:woff2?|png|jpe?g|webp|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ---------------------------------------------------------------------
    # React Router: every unknown path returns index.html.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------------
    # Security headers for static files. FastAPI sets the same headers for
    # API responses, so API calls are not duplicated here.
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # gzip static text assets (the API compresses its own JSON).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/aeropix.access.log;
    error_log  /var/log/nginx/aeropix.error.log;
}
