<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc">
  <title id="title">AEROPIX image upload sequence</title>
  <desc id="desc">A browser posts a multipart image with a JWT to FastAPI. FastAPI verifies the token and quota, the Pillow pipeline validates the real format and creates a stripped JPEG thumbnail, two objects are written to a private S3 bucket with AES256 server-side encryption, the metadata row is inserted into SQLite, and the API returns a presigned URL.</desc>

  <defs>
    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#15172A" opacity="0.07"/>
    </pattern>
    <linearGradient id="heroWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEE9FB" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F7F4EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#15172A" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#5B4BD6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#7C7F92" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .eyebrow { font: 600 12px "Segoe UI", Inter, sans-serif; letter-spacing: 2.6px; text-transform: uppercase; fill: #5B4BD6; }
      .title { font: 600 38px "Segoe UI", Inter, sans-serif; letter-spacing: -1.3px; fill: #15172A; }
      .subtitle { font: 400 15px "Segoe UI", Inter, sans-serif; fill: #626579; }
      .h3 { font: 600 15px "Segoe UI", Inter, sans-serif; letter-spacing: -0.2px; fill: #15172A; }
      .body { font: 400 11.5px "Segoe UI", Inter, sans-serif; fill: #626579; }
      .small { font: 400 10.5px "Segoe UI", Inter, sans-serif; fill: #8B8D9D; }
      .msg { font: 500 12px "Segoe UI", Inter, sans-serif; fill: #1C1F31; }
      .msgMuted { font: 400 12px "Segoe UI", Inter, sans-serif; fill: #626579; }
      .note { font: 400 12px "Segoe UI", Inter, sans-serif; fill: #C3C8D6; }
      .footer { font: 400 10.5px "Segoe UI", Inter, sans-serif; fill: #8B8D9D; }
      .pill { font: 600 11px "Segoe UI", Inter, sans-serif; fill: #4B3A8C; }
    </style>
  </defs>

  <rect width="1600" height="1010" fill="#F7F4EE"/>
  <rect width="1600" height="1010" fill="url(#dotGrid)"/>
  <rect x="0" y="0" width="840" height="400" fill="url(#heroWash)"/>

  <!-- Header -->
  <rect x="64" y="54" width="34" height="3" rx="1.5" fill="#5B4BD6"/>
  <text x="110" y="62" class="eyebrow">Request flow · image upload</text>
  <text x="64" y="112" class="title">From drop zone to encrypted object.</text>
  <text x="64" y="142" class="subtitle">FastAPI validates the file, writes two S3 objects with AES256, then commits metadata to SQLite.</text>

  <g transform="translate(1286 48)">
    <rect width="250" height="34" rx="17" fill="#FFFDF9" stroke="#D9D0F5"/>
    <circle cx="18" cy="17" r="4" fill="#5B4BD6"/>
    <text x="31" y="21" class="pill">JWT · 15 MB limit · UUID keys</text>
  </g>

  <!-- Lifelines -->
  <line x1="180" y1="300" x2="180" y2="900" stroke="#CFC8DA" stroke-width="1.4" stroke-dasharray="4 6"/>
  <line x1="540" y1="300" x2="540" y2="900" stroke="#CFC8DA" stroke-width="1.4" stroke-dasharray="4 6"/>
  <line x1="880" y1="300" x2="880" y2="900" stroke="#CFC8DA" stroke-width="1.4" stroke-dasharray="4 6"/>
  <line x1="1180" y1="300" x2="1180" y2="900" stroke="#CFC8DA" stroke-width="1.4" stroke-dasharray="4 6"/>
  <line x1="1460" y1="300" x2="1460" y2="900" stroke="#CFC8DA" stroke-width="1.4" stroke-dasharray="4 6"/>

  <!-- Participant cards -->
  <g filter="url(#cardShadow)">
    <rect x="75" y="190" width="210" height="96" rx="14" fill="#FFFDF9" stroke="#E4DDD0"/>
    <rect x="415" y="190" width="250" height="96" rx="14" fill="#FFFDF9" stroke="#E4DDD0"/>
    <rect x="770" y="190" width="220" height="96" rx="14" fill="#FFFDF9" stroke="#E4DDD0"/>
    <rect x="1070" y="190" width="220" height="96" rx="14" fill="#FFFDF9" stroke="#E4DDD0"/>
    <rect x="1365" y="190" width="190" height="96" rx="14" fill="#FFFDF9" stroke="#E4DDD0"/>
  </g>
  <rect x="75" y="190" width="210" height="5" rx="2.5" fill="#5B4BD6"/>
  <rect x="415" y="190" width="250" height="5" rx="2.5" fill="#38BDF8"/>
  <rect x="770" y="190" width="220" height="5" rx="2.5" fill="#8B7CF6"/>
  <rect x="1070" y="190" width="220" height="5" rx="2.5" fill="#A5622F"/>
  <rect x="1365" y="190" width="190" height="5" rx="2.5" fill="#4B5563"/>

  <text x="95" y="230" class="h3">Browser</text>
  <text x="95" y="251" class="body">React upload centre</text>
  <text x="95" y="270" class="small">Bearer token · XHR progress</text>

  <text x="435" y="230" class="h3">FastAPI</text>
  <text x="435" y="251" class="body">Gunicorn + Uvicorn</text>
  <text x="435" y="270" class="small">auth · quota · orchestration</text>

  <text x="790" y="230" class="h3">Pillow pipeline</text>
  <text x="790" y="251" class="body">magic bytes and limits</text>
  <text x="790" y="270" class="small">format · dimensions · thumbnail</text>

  <text x="1090" y="230" class="h3">Amazon S3</text>
  <text x="1090" y="251" class="body">private bucket</text>
  <text x="1090" y="270" class="small">SSE-S3 · no public access</text>

  <text x="1385" y="230" class="h3">SQLite</text>
  <text x="1385" y="251" class="body">metadata only</text>
  <text x="1385" y="270" class="small">users · images · albums</text>

  <!-- 1 · request -->
  <line x1="180" y1="355" x2="540" y2="355" stroke="#5B4BD6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="210" y="329" width="300" height="20" rx="6" fill="#F7F4EE"/>
  <text x="360" y="344" text-anchor="middle" class="msg">POST /api/images · multipart + Bearer JWT</text>

  <!-- 2 · self check -->
  <path d="M540 400 h74 v32 h-74" fill="none" stroke="#5B4BD6" stroke-width="1.8" marker-end="url(#arrow)" stroke-linejoin="round"/>
  <rect x="622" y="399" width="248" height="20" rx="6" fill="#F7F4EE"/>
  <text x="630" y="414" class="msg">verify JWT · load user · check quota</text>

  <!-- 3 · validation -->
  <line x1="540" y1="480" x2="880" y2="480" stroke="#5B4BD6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="560" y="454" width="300" height="20" rx="6" fill="#F7F4EE"/>
  <text x="710" y="469" text-anchor="middle" class="msg">validate extension · MIME · magic bytes · size</text>

  <!-- 4 · validation return -->
  <line x1="880" y1="535" x2="540" y2="535" stroke="#7C7F92" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
  <rect x="575" y="509" width="270" height="20" rx="6" fill="#F7F4EE"/>
  <text x="710" y="524" text-anchor="middle" class="msgMuted">format · dimensions · thumbnail JPEG</text>

  <!-- 5 · original object -->
  <line x1="540" y1="600" x2="1180" y2="600" stroke="#5B4BD6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="695" y="574" width="330" height="20" rx="6" fill="#F7F4EE"/>
  <text x="860" y="589" text-anchor="middle" class="msg">PutObject original · users/{id}/images/{uuid}.ext</text>

  <!-- 6 · thumbnail object -->
  <line x1="540" y1="655" x2="1180" y2="655" stroke="#5B4BD6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="735" y="629" width="250" height="20" rx="6" fill="#F7F4EE"/>
  <text x="860" y="644" text-anchor="middle" class="msg">PutObject thumbnail · AES256</text>

  <!-- 7 · insert -->
  <line x1="540" y1="720" x2="1460" y2="720" stroke="#5B4BD6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="890" y="694" width="220" height="20" rx="6" fill="#F7F4EE"/>
  <text x="1000" y="709" text-anchor="middle" class="msg">INSERT image row</text>

  <!-- 8 · commit -->
  <line x1="1460" y1="770" x2="540" y2="770" stroke="#7C7F92" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
  <rect x="905" y="744" width="190" height="20" rx="6" fill="#F7F4EE"/>
  <text x="1000" y="759" text-anchor="middle" class="msgMuted">id committed</text>

  <!-- 9 · response -->
  <line x1="540" y1="840" x2="180" y2="840" stroke="#7C7F92" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
  <rect x="212" y="814" width="296" height="20" rx="6" fill="#F7F4EE"/>
  <text x="360" y="829" text-anchor="middle" class="msgMuted">201 ImageOut · presigned URL (900 s)</text>

  <!-- Footer note -->
  <rect x="64" y="910" width="1472" height="66" rx="14" fill="#0A1024"/>
  <text x="88" y="936" class="note"><tspan fill="#F7F4EE" font-weight="600">Failure paths</tspan>  ·  422 if validation fails (nothing is written)  ·  quota checked before any write  ·  orphaned objects removed if the insert fails.</text>
  <text x="88" y="958" class="note">Object keys are random UUIDs; the original filename is metadata only. SSE-S3 encrypts both objects at rest.</text>

  <text x="64" y="994" class="footer">AEROPIX · upload sequence · original SVG diagram rendered at 2×</text>
</svg>
